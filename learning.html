<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Mode | truth.oflifes</title><style>:root{--bg:#031326;--panel:#08243d;--line:#1b5375;--blue:#159cff;--text:#eef9ff;--muted:#8eacbf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#07335a,#031326 45%);color:var(--text);font-family:Inter,system-ui,Arial}.wrap{width:min(1180px,calc(100% - 24px));margin:auto;padding:20px 0 50px}a{color:#6ed6ff;text-decoration:none}.top{display:flex;justify-content:space-between;gap:10px}.hero,.card{background:rgba(7,30,50,.96);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:16px}.hero h1{font-size:38px;margin:8px 0}.muted{color:var(--muted);line-height:1.5;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.subject{border:1px solid #174b70;background:#08243d;color:#fff;border-radius:13px;padding:15px;text-align:left;cursor:pointer}.subject:hover{border-color:#36cfff}.subject b{display:block}.subject small{display:block;color:#82a5ba;margin-top:5px}.chapterGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.chapter{border:1px solid #174b70;background:#071d31;color:#fff;border-radius:12px;padding:14px;text-align:left;cursor:pointer}.chapter b{display:block}.chapter small{color:#82a5ba}.btn{border:0;border-radius:9px;padding:10px 13px;background:#159cff;color:#fff;font-weight:900}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.chapterGrid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.chapterGrid{grid-template-columns:1fr}}
/* FINAL GRID LAYOUT: subjects and chapters always render as responsive card grids */
.subjectGrid,.subjects,.subjectPills{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:14px!important;align-items:stretch;}
.chapterGrid,.chapters,.chapterList{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:14px!important;align-items:stretch;}
@media(max-width:900px){.subjectGrid,.subjects,.subjectPills{grid-template-columns:repeat(3,minmax(0,1fr))!important}.chapterGrid,.chapters,.chapterList{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
@media(max-width:620px){.subjectGrid,.subjects,.subjectPills{grid-template-columns:repeat(2,minmax(0,1fr))!important}.chapterGrid,.chapters,.chapterList{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
</style></head><body><main class="wrap"><div class="top"><a href="/">← Home</a><a href="/student.html">Dashboard →</a></div><section class="hero"><span style="color:#36cfff;font-size:12px;font-weight:900">LEARNING MODE</span><h1>Choose a Subject → Chapter</h1><p class="muted">Every chapter has 50 MCQs. Start a random 20-question practice test or the full 50-question test with certificate eligibility.</p></section><section class="card"><h2 style="margin-top:0">📚 Subjects</h2><div id="subjects" class="grid"></div></section><section id="chaptersBox" class="card hidden"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 id="title" style="margin:0"></h2><p id="sub" class="muted"></p></div><button class="btn" onclick="back()">← Subjects</button></div><div id="chapters" class="chapterGrid" style="margin-top:15px"></div></section></main><script>
let map={};const subjects=['Anatomy','Physiology','Biochemistry','Pharmacology','Pathology','Microbiology','Forensic Medicine','Community Medicine','Medicine','Surgery','Pediatrics','OBG','Orthopedics','ENT','Ophthalmology','Radiology','Anesthesia','Psychiatry','Dermatology','Dentistry','Nursing','Other'];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){const r=await fetch('/api/chapters');map=await r.json();$('subjects').innerHTML=subjects.map(s=>'<button class="subject" onclick="openSubject(\''+esc(s)+'\')"><b>'+esc(s)+'</b><small>'+(map[s]||[]).length+' chapters · 50 MCQs each</small></button>').join('')}function openSubject(s){$('chaptersBox').classList.remove('hidden');$('title').textContent=s;$('sub').textContent='Choose a chapter. You can study Notes/Videos from Home or start a quiz here.';$('chapters').innerHTML=(map[s]||[]).map(c=>'<button class="chapter" onclick="location.href=\'/quiz.html?subjectName='+encodeURIComponent(s)+'&chapter='+encodeURIComponent(c)+'&questionCount=50\'"><b>'+esc(c)+'</b><small>50 MCQs · 20/50 test · explanations</small></button>').join('');$('chaptersBox').scrollIntoView({behavior:'smooth'})}function back(){$('chaptersBox').classList.add('hidden')}boot();
</script></body></html>
