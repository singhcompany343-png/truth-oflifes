<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medical Video Library | Truth.ofLifes</title><style>
:root{--bg:#061221;--card:#0b2034;--line:#194b6d;--text:#eef7ff;--muted:#9db7ca;--blue:#0a8ddd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px 16px 45px}a{color:#7bd3ff;text-decoration:none}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.hero{padding:20px 0 8px}.hero h1{margin:8px 0;font-size:32px}.hero p{color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;border:1px solid var(--line);background:#071b2d;color:#dff3ff;border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}.tab.active{background:var(--blue);border-color:#31c4ff;color:#fff}.group{border:1px solid #163d5a;border-radius:16px;padding:15px;margin:16px 0;background:linear-gradient(145deg,#061a2c,#081525)}.groupHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.groupHead h2{margin:0;font-size:19px}.count{color:#87abc4;font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #19415d;border-radius:13px;overflow:hidden;background:#061321}.card video{display:block;width:100%;aspect-ratio:16/9;background:#000;object-fit:cover}.body{padding:12px}.body h3{margin:0 0 6px;font-size:15px}.meta{font-size:11px;color:#8faec3}.empty{border:1px dashed #1d4e70;border-radius:14px;padding:25px;text-align:center;color:var(--muted)}.badge{display:inline-block;background:#082f4d;border:1px solid #146d9d;color:#76d9ff;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:900;margin-bottom:8px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.hero h1{font-size:25px}.grid{grid-template-columns:1fr}.group{padding:12px}}
</style></head><body><main class="wrap"><div class="top"><a href="/">← Home</a><a href="/learning.html">Learning Mode →</a></div><div class="hero"><span class="badge">VIDEO LIBRARY</span><h1>🎬 Medical Videos — Subject → Chapter</h1><p>Admin se upload kiye gaye videos yahan subject aur chapter ke hisaab se automatically merge hote hain.</p></div><div id="tabs" class="tabs"></div><div id="groups"><div class="empty">Loading videos…</div></div></main><script>
const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function load(){try{const r=await fetch('/api/resources',{cache:'no-store'});if(!r.ok)throw new Error('failed');const all=await r.json();const videos=(Array.isArray(all)?all:[]).filter(x=>String(x.type||'').toLowerCase()==='video');if(!videos.length){$('tabs').innerHTML='';$('groups').innerHTML='<div class="empty">No videos uploaded yet. Admin can add a video using Subject + Chapter + Video Name.</div>';return;}const map={};videos.forEach(v=>{const s=String(v.subject||'Other').trim()||'Other';(map[s]||(map[s]=[])).push(v);});const subjects=Object.keys(map).sort((a,b)=>a.localeCompare(b));$('tabs').innerHTML='<button class="tab active" data-filter="all">All Videos</button>'+subjects.map(s=>'<button class="tab" data-filter="'+esc(s)+'">'+esc(s)+'</button>').join('');$('groups').innerHTML=subjects.map(s=>{const cards=map[s].sort((a,b)=>String(a.chapter||'').localeCompare(String(b.chapter||''))).map(v=>'<article class="card"><video controls preload="metadata" playsinline src="/api/resources/'+encodeURIComponent(v.id)+'/video"></video><div class="body"><h3>'+esc(v.title||'Medical Video')+'</h3><div class="meta">'+esc(s)+' → '+esc(v.chapter||'General')+'</div></div></article>').join('');return '<section class="group" data-group="'+esc(s)+'"><div class="groupHead"><h2>📚 '+esc(s)+'</h2><span class="count">'+map[s].length+' video'+(map[s].length===1?'':'s')+'</span></div><div class="grid">'+cards+'</div></section>';}).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');const f=b.dataset.filter;document.querySelectorAll('[data-group]').forEach(g=>g.style.display=(f==='all'||g.dataset.group===f)?'block':'none');});}catch(e){$('groups').innerHTML='<div class="empty">Videos temporarily unavailable. Please try again.</div>';}}load();
</script></body></html>
