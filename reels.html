<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medical Reel Library | Truth.ofLifes</title><style>body{margin:0;background:#071426;color:#eef7ff;font:16px Arial}.wrap{max-width:1100px;margin:auto;padding:24px}a{color:#7bd3ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#112a43;border:1px solid #31506c;border-radius:18px;padding:18px}.scene{aspect-ratio:9/16;max-height:310px;background:linear-gradient(145deg,#d7f4ff,#e9e0ff);color:#17334a;border-radius:12px;display:grid;place-items:center;text-align:center;font-size:52px;padding:12px}.scene b{display:block;font-size:16px;background:#ffffffd9;border-radius:10px;padding:10px;margin-top:10px}</style><main class="wrap"><a href="/">← Home</a><h1>🎬 Medical Reel Library</h1><p>Recurring nurse character + cute white kitten (“Snowy”). Vertical 9:16 educational reel topic cards. Confirm medical facts with a qualified instructor before posting.</p><div class="grid" id="grid"></div><p>@truth.oflifes</p></main><script>const topics=['Hand hygiene: five moments','Understanding vital signs','How the heart pumps blood','Respiratory system basics','IV cannula: sizes and purpose','Recognizing dehydration','Safe medicine habits','First-aid basics: when to seek help','Kidney function explained','Common medical instruments'];grid.innerHTML=topics.map((t,i)=>`<article class="card"><div class="scene">👩‍⚕️<br>🐈<b>Episode ${i+1}: ${t}</b></div><p><b>Nurse + Snowy</b><br>9:16 reel concept</p><p>Educational topic idea; not a substitute for clinical training.</p></article>`).join('')</script></html>
