<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password — truth.oflifes</title><style>body{font-family:Arial,sans-serif;background:#f3f6fb;margin:0;padding:24px;color:#172033}.box{max-width:430px;margin:60px auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 4px 18px #0001}input,button{width:100%;padding:11px;margin:7px 0;border-radius:8px;border:1px solid #d5dbe5;box-sizing:border-box;font:inherit}button{background:#2563eb;color:#fff;border:0;font-weight:700}.msg{font-size:13px;color:#475569;margin-top:10px}a{color:#2563eb}</style></head><body><div class="box"><h2>🔐 Forgot Password</h2><p>Enter your Instagram username and the email linked to your account.</p><form id="f"><input id="u" placeholder="Instagram username" required><input id="e" type="email" placeholder="Email address" required><button>Send Reset Request</button></form><div id="m" class="msg"></div><p><a href="/">← Back to login</a></p></div><script>f.onsubmit=async x=>{x.preventDefault();m.textContent='Submitting…';try{let r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value.trim(),email:e.value.trim()})});let d=await r.json();m.textContent=d.message||'Request submitted.'}catch(err){m.textContent='Please try again later.'}}</script></body></html>
