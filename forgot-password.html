</head><body><div class="box"><h2>🔐 Forgot Password</h2><p>Enter your Instagram username and the email linked to your account.</p><form id="f"><input id="u" placeholder="Instagram username" required><input id="e" type="email" placeholder="Email address" required><button>Send Reset Request</button></form><div id="m" class="msg"></div><p><a href="/">← Back to login</a></p></div><script>
const form = document.getElementById("f");
const usernameInput = document.getElementById("u");
const emailInput = document.getElementById("e");
const message = document.getElementById("m");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  message.textContent = "Submitting…";

  try {
    const response = await fetch("/api/auth/forgot-password", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        username: usernameInput.value.trim(),
        email: emailInput.value.trim()
      })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.error || "Could not submit request.");
    }

    message.textContent =
      data.message ||
      "Reset request submitted. Please contact the admin to complete the reset.";
    form.reset();
  } catch (error) {
    message.textContent = error.message || "Please try again later.";
  }
});
</script></body></html>
