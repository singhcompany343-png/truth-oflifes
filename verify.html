<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Verification | truth.oflifes</title><style>body{margin:0;background:#07182b;color:#edf6ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}.card{width:min(680px,100%);background:#102943;border:1px solid #b99b52;border-radius:20px;padding:26px;box-sizing:border-box}h1{color:#e7c66e}dt{color:#9eb7cc;margin-top:14px}dd{margin:4px 0;font-size:18px;overflow-wrap:anywhere}.status{padding:12px;border-radius:10px;background:#173b30;color:#8df0ba}a{color:#7dd3fc}</style></head><body><main class="card"><p>TRUTH.OFLIFES · LEARN • GROW • HEAL</p><h1>Certificate Verification</h1><div id="result">Checking certificate…</div><p><a href="/">Return to website</a></p></main><script>const code=new URLSearchParams(location.search).get('code');const el=document.getElementById('result');if(!code){el.textContent='Missing certificate code.'}else fetch('/api/learning/certificates/verify/'+encodeURIComponent(code)).then(async r=>({ok:r.ok,data:await r.json()})).then(({ok,data})=>{if(!ok||!data.valid){el.innerHTML='<p style="color:#ff9da8">Certificate not found or invalid.</p>';return}const c=data.certificate;el.innerHTML='<div class="status">✓ Valid certificate record</div><dl><dt>Certificate holder</dt><dd>'+esc(c.student)+'</dd><dt>Course</dt><dd>'+esc(c.subject||'Medical Learning')+(c.chapter?' — '+esc(c.chapter):'')+'</dd><dt>Marks</dt><dd>'+Number(c.score)+' / '+Number(c.max_score)+'</dd><dt>Percentage</dt><dd>'+Number(c.percentage).toFixed(2)+'%</dd><dt>Certificate code</dt><dd>'+esc(c.certificate_code)+'</dd><dt>Issue date</dt><dd>'+new Date(c.issued_at).toLocaleDateString('en-IN')+'</dd></dl><small>'+esc(data.notice||'Educational completion certificate.')+'</small>'}).catch(()=>el.textContent='Could not verify right now. Please try again.');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
