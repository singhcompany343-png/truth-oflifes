<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCQ Quiz | truth.oflifes</title><style>
:root{--bg:#031326;--panel:#08233c;--line:#1b5375;--blue:#159cff;--text:#eef9ff;--muted:#8eacbf;--green:#36dc9a;--red:#ff7187}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#07335a,#031326 45%);color:var(--text);font-family:Inter,system-ui,Arial}.wrap{width:min(920px,calc(100% - 26px));margin:auto;padding:20px 0 50px}a{color:#6ed6ff;text-decoration:none}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.card{background:rgba(7,30,50,.96);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:16px;box-shadow:0 18px 50px rgba(0,0,0,.2)}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#0a3553;color:#9de7ff;font-size:10px;font-weight:900}.muted{color:var(--muted);line-height:1.5}.primary,.secondary{border:0;border-radius:10px;padding:12px 17px;font-weight:900;color:#fff;cursor:pointer}.primary{background:linear-gradient(135deg,#17a0ff,#0878d0)}.secondary{background:#0b2b44;border:1px solid #215b7b}.startGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{display:block;width:100%;text-align:left;padding:15px;border:1px solid #1b5375;border-radius:12px;background:#092944;color:#fff;margin:9px 0;cursor:pointer}.option:hover{border-color:#36cfff}.option:disabled{cursor:default}.option.correct{border-color:var(--green);background:rgba(54,220,154,.12)}.option.wrong{border-color:var(--red);background:rgba(255,113,135,.1)}.bar{height:8px;border-radius:10px;background:#0b314c;overflow:hidden;margin:15px 0}.bar span{display:block;height:100%;background:#159cff;width:0}.quizHead{display:flex;justify-content:space-between;gap:12px;align-items:center}.timer{font-weight:900;color:#6ed6ff;background:#092b45;border:1px solid #1b5b80;border-radius:999px;padding:8px 12px}.feedback{border-left:3px solid #159cff;padding:10px 12px;background:#071e32;border-radius:8px;line-height:1.5}.feedback.good{border-color:var(--green)}.feedback.bad{border-color:var(--red)}.hidden{display:none!important}.resultScore{font-size:44px;font-weight:900;color:#54d5ff}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}@media(max-width:620px){.startGrid{grid-template-columns:1fr}.card{padding:16px}.quizHead{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><div class="top"><a href="/">← Home</a><a href="/student.html">Student Dashboard →</a></div><section id="start" class="card"></section><section id="quiz" class="card hidden"><div class="quizHead"><div><span class="pill" id="mode"></span><div id="count" class="muted" style="margin-top:7px"></div></div><div id="timer" class="timer">00:00</div></div><div class="bar"><span id="bar"></span></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="next" class="primary hidden">Next →</button><button id="finish" class="secondary hidden">Finish Test</button></div></section><section id="result" class="card hidden"></section></main><script>
const token=localStorage.getItem('truthToken')||'';const p=new URLSearchParams(location.search);const subjectName=p.get('subjectName')||'';const chapter=p.get('chapter')||'';const requested=[20,50].includes(Number(p.get('questionCount')))?Number(p.get('questionCount')):50;let subjectId=0,attemptId='',timerHandle=null,current=null,answered=false;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){if(!token){$('start').innerHTML='<span class="pill">LOGIN REQUIRED</span><h1>Medical Quiz</h1><p class="muted">Login to save quiz attempts, progress, wrong-question revision and certificates.</p><button class="primary" onclick="location.href=&#x27;/?login=1&#x27;">Login / Create Account →</button>';return;}try{const r=await fetch('/api/learning/subjects',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load subjects');const s=(d.subjects||[]).find(x=>x.name.toLowerCase()===subjectName.toLowerCase());if(!s)throw new Error('Subject not found.');subjectId=s.id;$('start').innerHTML='<span class="pill">'+(chapter?'CHAPTER TEST':'SUBJECT TEST')+'</span><h1>'+esc(subjectName)+(chapter?' → '+esc(chapter):'')+'</h1><p class="muted">'+requested+' questions · '+(requested===50?'30 minutes':'12 minutes')+' · instant correct/incorrect explanations · score saved to your dashboard.'+(requested===50?' A score of 40/50 (80%) or more earns an educational completion certificate.':'')+'</p><div class="startGrid"><button class="primary" onclick="start()">Start '+requested+' MCQs →</button><button class="secondary" onclick="location.href=&#x27;/student.html&#x27;">View Progress</button></div>';}catch(e){$('start').innerHTML='<p style="color:#ff7187">'+esc(e.message)+'</p>';}}
async function start(){const r=await fetch('/api/learning/attempts',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({subject_id:subjectId,chapter,question_count:requested})});const d=await r.json();if(!r.ok){alert(d.error||'Could not start test');return}attemptId=d.attempt_id;$('start').classList.add('hidden');$('quiz').classList.remove('hidden');$('mode').textContent=(chapter?'CHAPTER':'SUBJECT')+' · '+requested+' MCQs';startTimer(d.duration_seconds);await loadQuestion()}
function startTimer(seconds){clearInterval(timerHandle);let end=Date.now()+seconds*1000;function tick(){let left=Math.max(0,Math.ceil((end-Date.now())/1000));$('timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0){clearInterval(timerHandle);finish(true)}}tick();timerHandle=setInterval(tick,500)}
async function loadQuestion(){const r=await fetch('/api/learning/attempts/'+attemptId+'/current',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(d.completed){showResult(d);return}if(!r.ok){alert(d.error||'Could not load question');return}current=d;answered=false;$('count').textContent='Question '+d.question_number+' of '+d.total;$('question').textContent=d.question;$('options').innerHTML=d.options.map((x,i)=>'<button class="option" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(x)+'</button>').join('');$('feedback').className='feedback hidden';$('next').classList.add('hidden');$('finish').classList.remove('hidden');$('bar').style.width=((d.question_number-1)/d.total*100)+'%';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));}
async function answer(index){if(answered)return;answered=true;document.querySelectorAll('.option').forEach(b=>b.disabled=true);const r=await fetch('/api/learning/attempts/'+attemptId+'/answer',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({selected_index:index})});const d=await r.json();if(!r.ok){alert(d.error||'Could not save answer');return}document.querySelectorAll('.option').forEach(b=>{const n=Number(b.dataset.i);if(n===d.correct_index)b.classList.add('correct');if(n===index&&!d.correct)b.classList.add('wrong')});$('feedback').className='feedback '+(d.correct?'good':'bad');$('feedback').classList.remove('hidden');$('feedback').innerHTML=(d.correct?'✅ <b>Correct!</b> ':'❌ <b>Incorrect.</b> Correct answer: <b>'+esc(d.correct_answer)+'</b><br>')+esc(d.explanation||'');$('next').textContent=d.remaining===0?'Show Result':'Next →';$('next').classList.remove('hidden');$('finish').classList.add('hidden');$('next').onclick=()=>d.remaining===0?finish(false):loadQuestion();if(d.completed)showResult(d)}
async function finish(timeout){clearInterval(timerHandle);const r=await fetch('/api/learning/attempts/'+attemptId+'/finish',{method:'POST',headers:{Authorization:'Bearer '+token}});const d=await r.json();showResult(d)}
function showResult(d){clearInterval(timerHandle);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const pass=!!d.passed;const pct=Number(d.percentage||0);$('result').innerHTML='<span class="pill">'+(pass?'CERTIFICATE EARNED':'TEST COMPLETED')+'</span><h1>'+esc(subjectName)+(chapter?' → '+esc(chapter):'')+'</h1><div class="resultScore">'+esc(d.score||0)+' / '+esc(d.max_score||requested)+'</div><p class="muted"><b>'+pct+'%</b> · '+(d.timeout?'Time expired. ':'')+(pass?'You reached the 80% certificate threshold.':'Keep practicing and review your wrong answers.')+'</p><div class="actions">'+(d.certificate_code?'<button class="primary" onclick="downloadCert(\''+esc(d.certificate_code)+'\')">⬇ Download Certificate</button>':'')+'<button class="secondary" onclick="location.href=\'/student.html#history\'">Attempt History</button><button class="secondary" onclick="location.href=\'/student.html#wrong\'">Wrong Questions</button><button class="primary" onclick="location.href=\'/\'">Back Home</button></div>'}
async function downloadCert(code){const r=await fetch('/api/learning/certificates/'+encodeURIComponent(code)+'/download',{headers:{Authorization:'Bearer '+token}});if(!r.ok){alert('Certificate unavailable');return}const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='truth-oflifes-'+code+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
init();
</script></body></html>
