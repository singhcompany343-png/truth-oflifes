<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medical MCQ Quiz | Truth.ofLifes</title><style>body{margin:0;background:#071426;color:#eef7ff;font:16px Arial}.wrap{max-width:850px;margin:auto;padding:24px}.card{background:#112a43;border:1px solid #31506c;border-radius:18px;padding:24px;margin-top:22px}a{color:#7bd3ff}button{display:block;width:100%;padding:14px;margin:10px 0;border:1px solid #42627e;border-radius:12px;background:#1b3c5a;color:white;text-align:left;font-size:16px;cursor:pointer}.bar{height:8px;background:#29445b;border-radius:8px}.bar span{display:block;height:8px;background:#21b8e8;width:0}#feedback{color:#9fe2b1;line-height:1.5}</style><main class="wrap"><a href="/">← Home</a><h1>🧠 Medical MCQ Quiz</h1><p>Basic anatomy and physiology practice. For education only.</p><div class="bar"><span id="bar"></span></div><section class="card"><small id="count"></small><h2 id="q"></h2><div id="opts"></div><p id="feedback"></p><button id="next" hidden>Next</button></section><p>@truth.oflifes</p></main><script>const data=[['Which organ pumps blood?',['Lungs','Heart','Kidney','Liver'],1,'The heart circulates blood.'],['Functional unit of kidney?',['Neuron','Nephron','Alveolus','Villus'],1,'Nephrons filter blood and help form urine.'],['How many chambers in the human heart?',['2','3','4','5'],2,'Two atria and two ventricles.'],['Which cells carry most oxygen?',['Red blood cells','Platelets','White blood cells','Plasma'],0,'Hemoglobin in red blood cells carries oxygen.'],['Largest organ by surface area?',['Liver','Skin','Brain','Lung'],1,'The skin is the largest organ by surface area.'],['Which brain part helps balance?',['Cerebellum','Medulla','Thalamus','Pons'],0,'The cerebellum coordinates balance and movement.'],['Muscle attaches to bone through?',['Ligament','Tendon','Cartilage','Nerve'],1,'Tendons connect muscle to bone.'],['Which gas is used in cellular respiration?',['Oxygen','Carbon dioxide','Hydrogen','Helium'],0,'Cells use oxygen in aerobic respiration.'],['Which organ filters blood to make urine?',['Kidney','Stomach','Spleen','Pancreas'],0,'Kidneys filter blood and regulate fluid balance.'],['Which vessels carry blood away from the heart?',['Veins','Arteries','Capillaries','Venules'],1,'Arteries carry blood away from the heart.']];let i=0,score=0,done=false;function draw(){done=false;count.textContent=`Question ${i+1} of ${data.length}`;q.textContent=data[i][0];opts.innerHTML='';feedback.textContent='';next.hidden=true;bar.style.width=(i/data.length*100)+'%';data[i][1].forEach((v,j)=>{let b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>{if(done)return;done=true;[...opts.children].forEach(x=>x.disabled=true);if(j===data[i][2]){score++;feedback.textContent='Correct! '+data[i][3]}else feedback.textContent='Correct answer: '+data[i][1][data[i][2]]+'. '+data[i][3];next.hidden=false;next.textContent=i===data.length-1?'Show score':'Next';bar.style.width=((i+1)/data.length*100)+'%'};opts.append(b)})}next.onclick=()=>{if(i<data.length-1){i++;draw()}else{q.textContent='Quiz complete!';opts.innerHTML='';feedback.textContent=`Your score: ${score}/${data.length}`;next.textContent='Try again';next.onclick=()=>{i=0;score=0;draw()}}};draw();</script></html>
