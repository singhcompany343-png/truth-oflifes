<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medical MCQ Quiz | Truth.ofLifes</title><style>body{margin:0;background:#071426;color:#eef7ff;font:16px Inter,Arial}.wrap{max-width:900px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top a{color:#7bd3ff}.card{background:#112a43;border:1px solid #31506c;border-radius:18px;padding:22px;margin-top:18px}.bar{height:8px;background:#29445b;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:#21b8e8;width:0}button{display:block;width:100%;padding:14px;margin:10px 0;border:1px solid #42627e;border-radius:12px;background:#1b3c5a;color:white;text-align:left;font-size:16px;cursor:pointer}button:hover{border-color:#6bdcff}.primary{background:#078fe0;border-color:#65d1ff}.meta{color:#8fb0c6}.ok{color:#9fe2b1;line-height:1.5}.bad{color:#ff9eab;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.chapter{background:#0d2943}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#0b3553;color:#9ee8ff;font-size:11px;font-weight:800}.hidden{display:none!important}</style></head><body><main class="wrap"><div class="top"><a href="/learning.html">← Learning Mode</a><a href="/">Home</a></div><h1>🧠 Medical MCQ Quiz</h1><p id="mode" class="meta">Loading…</p><div class="bar"><span id="bar"></span></div><section id="start" class="card"></section><section id="quiz" class="card hidden"><small id="count"></small><h2 id="q"></h2><div id="opts"></div><p id="feedback"></p><button id="next" class="primary hidden">Next</button></section><section id="result" class="card hidden"></section></main><script>
const $=id=>document.getElementById(id);const token=localStorage.getItem('truthToken')||'';const params=new URLSearchParams(location.search);const chapter=params.get('chapter')||'';const subjectName=params.get('subjectName')||'';const subjectId=Number(params.get('subject')||0);let qs=[],i=0,score=0,answered=false,attemptId='';
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function chapterStart(){
 const r=await fetch('/api/learning/chapter-mcqs?subject='+encodeURIComponent(subjectName)+'&chapter='+encodeURIComponent(chapter));
 const d=await r.json();if(!r.ok)throw new Error(d.error||'Chapter MCQs unavailable');qs=d.questions||[];$('mode').textContent=subjectName+' → '+chapter+' • '+qs.length+' basic MCQs';$('start').innerHTML='<span class="pill">CHAPTER PRACTICE</span><h2>'+esc(chapter)+'</h2><p class="meta">Basic MCQs with instant answer explanations. Login is not required for practice.</p><button class="primary" onclick="startLocal()">Start Chapter MCQs →</button>';
}
async function subjectStart(){
 $('mode').textContent='Subject assessment • 50 MCQs';$('start').innerHTML='<span class="pill">SUBJECT TEST</span><h2>50-question assessment</h2><p class="meta">Login is required so your score and educational certificate can be saved.</p><button class="primary" onclick="startServerQuiz()">Start Subject Test →</button>';
}
function startLocal(){i=0;score=0;$('start').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');draw();}
function draw(){answered=false;const x=qs[i];$('count').textContent=`Question ${i+1} of ${qs.length}`;$('q').textContent=x.question;$('opts').innerHTML=x.options.map((v,j)=>`<button data-i="${j}">${String.fromCharCode(65+j)}. ${esc(v)}</button>`).join('');$('feedback').textContent='';$('next').classList.add('hidden');$('bar').style.width=((i/qs.length)*100)+'%';$('opts').querySelectorAll('button').forEach(b=>b.onclick=()=>answerLocal(Number(b.dataset.i)));}
function answerLocal(j){if(answered)return;answered=true;const x=qs[i];$('opts').querySelectorAll('button').forEach(b=>b.disabled=true);if(j===x.correct_index){score++;$('feedback').className='ok';$('feedback').textContent='Correct! '+x.explanation}else{$('feedback').className='bad';$('feedback').textContent='Correct answer: '+x.options[x.correct_index]+'. '+x.explanation}$('bar').style.width=((i+1)/qs.length*100)+'%';$('next').textContent=i===qs.length-1?'Show Score':'Next';$('next').classList.remove('hidden');$('next').onclick=()=>{if(i<qs.length-1){i++;draw()}else finishLocal()};}
function finishLocal(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML='<span class="pill">COMPLETED</span><h2>'+esc(chapter)+'</h2><p>Your score: <b>'+score+'/'+qs.length+'</b></p><p class="meta">40/50 (80%) is the certificate threshold. Chapter practice itself is not a certificate assessment.</p><button class="primary" onclick="location.href=\'/learning.html\'">Back to Learning Mode</button>';$('bar').style.width='100%';}
async function startServerQuiz(){if(!token){location.href='/?login=1';return;}if(!subjectId){const r=await fetch('/api/learning/subjects',{headers:{Authorization:'Bearer '+token}});if(r.ok){const d=await r.json();const x=(d.subjects||[]).find(s=>s.name.toLowerCase()===subjectName.toLowerCase()||s.slug===subjectName.toLowerCase().replace(/[^a-z0-9]+/g,'-'));if(x) return location.href='/quiz.html?subject='+x.id;}}
 const r=await fetch('/api/learning/attempts',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({subject_id:subjectId})});const d=await r.json();if(!r.ok){$('start').innerHTML='<p class="bad">'+esc(d.error||'Could not start quiz')+'</p>';return;}attemptId=d.attempt_id;$('start').classList.add('hidden');$('quiz').classList.remove('hidden');await loadServerQuestion();}
async function loadServerQuestion(){const r=await fetch('/api/learning/attempts/'+attemptId+'/current',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(d.completed)return;window.serverQ=d;$('count').textContent='Question '+d.question_number+' of '+d.total;$('q').textContent=d.question;$('opts').innerHTML=d.options.map((v,j)=>`<button data-i="${j}">${String.fromCharCode(65+j)}. ${esc(v)}</button>`).join('');$('feedback').textContent='';$('next').classList.add('hidden');$('bar').style.width=((d.question_number-1)/d.total*100)+'%';$('opts').querySelectorAll('button').forEach(b=>b.onclick=()=>answerServer(Number(b.dataset.i)));}
async function answerServer(j){$('opts').querySelectorAll('button').forEach(b=>b.disabled=true);const r=await fetch('/api/learning/attempts/'+attemptId+'/answer',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({selected_index:j})});const d=await r.json();if(d.completed){finishServer(d);return;}$('feedback').className=d.correct?'ok':'bad';$('feedback').textContent=d.correct?'Correct! ':'Incorrect. '+(d.explanation||'');$('next').textContent='Next';$('next').classList.remove('hidden');$('next').onclick=async()=>{await loadServerQuestion();};$('bar').style.width=((serverQ.question_number)/50*100)+'%';}
function finishServer(x){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');var passed=!!x.passed;$('result').innerHTML='<span class="pill">'+(passed?'CERTIFICATE EARNED':'ASSESSMENT COMPLETED')+'</span><h2>Assessment completed '+(passed?'🎓':'')+'</h2><p>Your score: <b>'+esc(x.score||'')+'/'+esc(x.max_score||50)+'</b> ('+esc(x.percentage||0)+'%)</p><p class="meta">'+(passed?'Congratulations! You scored 40/50 (80%) or more, so your educational certificate is available.':'Certificate threshold: 40/50 (80%). Please retake the subject test to earn the certificate.')+'</p>'+(x.certificate_code?'<button class="primary" onclick="downloadCert(\''+esc(x.certificate_code)+'\')">⬇ Download Certificate PDF</button>':'')+'<button onclick="location.href=\'/student.html\'">Open Student Dashboard</button>';$('bar').style.width='100%';}
async function downloadCert(code){const r=await fetch('/api/learning/certificates/'+encodeURIComponent(code)+'/download',{headers:{Authorization:'Bearer '+token}});if(!r.ok){alert('Certificate download unavailable.');return;}const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='truth-oflifes-'+code+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
(async()=>{try{if(chapter&&subjectName){await chapterStart();}else if(subjectId||subjectName){await subjectStart();}else{$('mode').textContent='Choose a subject from Learning Mode';$('start').innerHTML='<p class="meta">Open Learning Mode and select a subject, then choose any chapter for basic MCQs.</p><button class="primary" onclick="location.href=\'/learning.html\'">Open Learning Mode →</button>';}}catch(e){$('start').innerHTML='<p class="bad">'+esc(e.message)+'</p>';}})();
</script></body></html>
