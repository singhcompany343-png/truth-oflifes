<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard | Truth.ofLifes</title><style>body{margin:0;background:#071426;color:#eef7ff;font:16px Arial}.wrap{max-width:900px;margin:auto;padding:24px}a{color:#7bd3ff}.card{background:#112a43;border:1px solid #31506c;border-radius:18px;padding:22px;margin:18px 0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.tile{background:#1b3c5a;border-radius:14px;padding:18px}input,button{padding:13px;border-radius:10px;border:1px solid #42627e;background:#0a1c30;color:white}</style><main class="wrap"><a href="/">← Home</a><h1>🎓 Student Dashboard</h1><section class="card"><h2 id="welcome">Welcome, student!</h2><p>Set a display name for this device.</p><input id="name" placeholder="Your name"><button onclick="save()">Save</button><p id="msg"></p></section><section class="card"><h2>Study shortcuts</h2><div class="tiles"><a class="tile" href="/">📚<br>Notes & PPT library</a><a class="tile" href="/quiz.html">🧠<br>Practice MCQs</a><a class="tile" href="/reels.html">🎬<br>Medical Reel Library</a></div></section><p>Display name is stored locally in this browser only. No cross-device progress sync.</p></main><script>function save(){let n=name.value.trim();if(n){localStorage.setItem('tol_name',n);show()}}function show(){let n=localStorage.getItem('tol_name');welcome.textContent=n?'Welcome back, '+n+'!':'Welcome, student!';if(n)name.value=n}show()</script></html>
